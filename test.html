<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST BALLS</title>

<!-- FAVICON -->
<link rel="icon" type="image/jpeg" href="image/SØNNER LOGO.JPG">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
  background: #000;
}

/* BLURRED BACKGROUND */
#bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  transform: scale(1.08);
  filter: blur(0.5px) brightness(0.8);
}

#bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
}

/* FIELD */
#field {
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2;
}

/* BALLS */
.ball {
  position: absolute;

  background-image: url("image/golfball.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

  cursor: pointer;

  transition:
    opacity 700ms cubic-bezier(0.22, 1, 0.36, 1),
    transform 700ms cubic-bezier(0.22, 1, 0.36, 1),
    filter 700ms ease;
}

.ball.fade {
  opacity: 0;
  transform: scale(0.85);
  filter: blur(6px);
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="field"></div>

<script>
const field = document.getElementById("field");
const bg = document.getElementById("bg");

const ballCount = 24;

const backgrounds = [
  "image/player2.png",
  "image/lostball.png"
];

function randomBackground() {
  return backgrounds[Math.floor(Math.random() * backgrounds.length)];
}

function setBackground() {
  bg.style.backgroundImage = `url('${randomBackground()}')`;
}

/* distance check BUT relaxed */
function isValid(x, y, positions, minDist) {
  for (const p of positions) {
    const dx = x - p.x;
    const dy = y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < minDist) return false;
  }
  return true;
}

/* softer clustering generator */
function generatePositions() {
  const positions = [];
  const padding = 90;

  const w = window.innerWidth;
  const h = window.innerHeight;

  let attempts = 0;

  while (positions.length < ballCount && attempts < 6000) {
    attempts++;

    const x = padding + Math.random() * (w - padding * 2);
    const y = padding + Math.random() * (h - padding * 2);

    const minDist = 110 + Math.random() * 40;

    if (isValid(x, y, positions, minDist)) {
      positions.push({ x, y });
    }
  }

  return positions;
}

function createBalls() {
  const positions = generatePositions();

  positions.forEach((pos) => {
    const ball = document.createElement("div");
    ball.classList.add("ball");

    const size = 185 + Math.random() * 12;

    ball.style.width = size + "px";
    ball.style.height = size + "px";

    ball.style.left = (pos.x - size / 2) + "px";
    ball.style.top = (pos.y - size / 2) + "px";

    field.appendChild(ball);

    ball.addEventListener("click", () => {
      ball.style.pointerEvents = "none";
      ball.classList.add("fade");

      setTimeout(() => {
        ball.remove();

        if (field.querySelectorAll(".ball").length === 0) {
          setTimeout(reset, 900);
        }
      }, 700);
    });
  });
}

function reset() {
  field.innerHTML = "";
  setBackground();
  createBalls();
}

function start() {
  setBackground();
  createBalls();
}

window.addEventListener("load", start);
</script>

</body>
</html>
