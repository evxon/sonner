<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST BALLS</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
  background: #000;
}

/* BLURRED BACKGROUND LAYER */
#bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  transform: scale(1.08); /* prevents blur edge cut-off */
  filter: blur(18px) brightness(0.8);
}

/* DARK OVERLAY for Apple-like depth */
#bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.25);
}

/* FIELD (balls layer) */
#field {
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 2;
}

/* BALLS */
.ball {
  position: absolute;

  background-image: url("image/golfball.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

  opacity: 0;

  transition:
    opacity 900ms cubic-bezier(0.22, 1, 0.36, 1),
    transform 900ms cubic-bezier(0.22, 1, 0.36, 1),
    filter 900ms ease;

  z-index: 2;
  cursor: pointer;

  transform: scale(0.85) translateY(10px);
}

.ball.show {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.ball.fade {
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  filter: blur(6px);
}
</style>
</head>

<body>

<!-- BLURRED BACKGROUND -->
<div id="bg"></div>

<!-- BALL FIELD -->
<div id="field"></div>

<script>
const field = document.getElementById("field");
const bg = document.getElementById("bg");

const ballCount = 12;

const backgrounds = [
  "image/image1.png",
  "image/image2.png",
  "image/player2.png"
];

function randomBackground() {
  return backgrounds[Math.floor(Math.random() * backgrounds.length)];
}

/* smoother Apple-like scatter */
function randomScatter(i) {
  const cols = 3;
  const rows = 4;

  const col = i % cols;
  const row = Math.floor(i / cols);

  let x = (col / (cols - 1)) * 75 + 12;
  let y = (row / (rows - 1)) * 75 + 12;

  x += (Math.random() - 0.5) * 25;
  y += (Math.random() - 0.5) * 25;

  return {
    x: Math.max(0, Math.min(100, x)),
    y: Math.max(0, Math.min(100, y))
  };
}

function setBackground() {
  const img = randomBackground();
  bg.style.backgroundImage = `url('${img}')`;
  return img;
}

function createBalls() {
  for (let i = 0; i < ballCount; i++) {

    const delay = i * 120;

    setTimeout(() => {
      const ball = document.createElement("div");
      ball.classList.add("ball");

      const pos = randomScatter(i);

      ball.style.left = pos.x + "vw";
      ball.style.top = pos.y + "vh";

      const size = 185 + Math.random() * 12;
      ball.style.width = size + "px";
      ball.style.height = size + "px";

      field.appendChild(ball);

      requestAnimationFrame(() => {
        ball.classList.add("show");
      });

      ball.addEventListener("click", () => {
        ball.style.pointerEvents = "none";
        ball.classList.add("fade");

        setTimeout(() => {
          ball.remove();

          if (field.querySelectorAll(".ball").length === 0) {
            setTimeout(reset, 900);
          }
        }, 900);
      });

    }, delay);
  }
}

function reset() {
  field.innerHTML = "";
  setBackground();
  createBalls();
}

function start() {
  setBackground();
  createBalls();
}

window.addEventListener("load", start);
</script>

</body>
</html>
