<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST BALLS</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
  background: #000;
}

/* ENTRY SCREEN */
#entry {
  position: absolute;
  inset: 0;
  z-index: 10;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* THIS is the ONLY animated layer (background image) */
#entryBg {
  position: absolute;
  inset: 0;

  background-image: url("image/picking.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  animation: breathe 12s ease-in-out infinite;
}

/* ONLY background moves */
@keyframes breathe {
  0% { transform: scale(1); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

/* TEXT is completely separate → NO movement */
#entryText {
  position: relative;
  color: white;
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 6px;
  z-index: 2;
  pointer-events: none;
  animation: none;
  transform: none;
}

#entry.fade-out {
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease, transform 1.2s ease;
  transform: scale(1.08);
}

/* FIELD */
#field {
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  background-color: #111;

  opacity: 0;
  transition: opacity 1.2s ease;
}

#field.visible {
  opacity: 1;
}

#field::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.02);
  pointer-events: none;
}

/* BALLS */
.ball {
  position: absolute;

  background-image: url("image/golfball.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

  opacity: 0;

  transition: opacity 1s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1), filter 1s ease;

  z-index: 2;
  cursor: pointer;
}

.ball.show {
  opacity: 1;
}

.ball.fade {
  opacity: 0;
  transform: scale(0.85);
  filter: blur(6px);
}
</style>
</head>

<body>

<!-- ENTRY -->
<div id="entry">
  <div id="entryBg"></div>
  <div id="entryText">LOST BALL</div>
</div>

<!-- FIELD -->
<div id="field"></div>

<script>
const entry = document.getElementById("entry");
const field = document.getElementById("field");

const ballCount = 12;

const backgrounds = [
  "image/image1.png",
  "image/image2.png",
  "image/image3.png"
];

function randomBackground() {
  return backgrounds[Math.floor(Math.random() * backgrounds.length)];
}

function randomScatter(i) {
  const cols = 3;
  const rows = 4;

  const col = i % cols;
  const row = Math.floor(i / cols);

  let x = (col / (cols - 1)) * 80 + 10;
  let y = (row / (rows - 1)) * 80 + 10;

  x += (Math.random() - 0.5) * 20;
  y += (Math.random() - 0.5) * 20;

  x = Math.max(0, Math.min(100, x));
  y = Math.max(0, Math.min(100, y));

  return { x, y };
}

function createBalls() {
  for (let i = 0; i < ballCount; i++) {

    const ball = document.createElement("div");
    ball.classList.add("ball");

    const pos = randomScatter(i);

    ball.style.left = pos.x + "vw";
    ball.style.top = pos.y + "vh";

    const size = 190 + Math.random() * 10;
    ball.style.width = size + "px";
    ball.style.height = size + "px";

    field.appendChild(ball);

    requestAnimationFrame(() => {
      ball.classList.add("show");
    });

    ball.addEventListener("click", () => {
      ball.style.pointerEvents = "none";
      ball.classList.add("fade");

      setTimeout(() => {
        ball.remove();

        if (field.querySelectorAll(".ball").length === 0) {
          setTimeout(reset, 1200);
        }
      }, 1000);
    });
  }
}

function start() {
  field.style.backgroundImage = `url('${randomBackground()}')`;

  field.classList.add("visible");
  entry.classList.add("fade-out");

  setTimeout(createBalls, 500);

  setTimeout(() => {
    entry.style.display = "none";
  }, 1200);
}

function reset() {
  field.innerHTML = "";
  field.style.backgroundImage = `url('${randomBackground()}')`;
  createBalls();
}

entry.addEventListener("click", start);
</script>

</body>
</html>
