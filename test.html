<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOST BALL</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
  background: #000;
}

/* ENTRY SCREEN */
#entry {
  position: absolute;
  inset: 0;

  background-image: url("image/picking.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  justify-content: center;
  align-items: center;

  color: white;
  font-size: 20px;
  font-weight: 300;
  letter-spacing: 6px;

  cursor: pointer;
  z-index: 10;

  opacity: 1;
  transition:
    opacity 1.2s ease,
    transform 1.2s ease;

  /* Ambient breathing movement */
  animation: breathe 12s ease-in-out infinite;
  transform-origin: center center;
}

@keyframes breathe {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.04);
  }

  100% {
    transform: scale(1);
  }
}

/* ENTRY FADE OUT */
#entry.fade-out {
  opacity: 0;
  transform: scale(1.08);
  pointer-events: none;
}

/* FIELD */
#field {
  position: absolute;
  inset: 0;

  background-image: url("image/image1.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  opacity: 0;
  transition: opacity 1.2s ease;
}

/* FIELD FADE IN */
#field.visible {
  opacity: 1;
}

#field::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.03);
  pointer-events: none;
}

/* GOLF BALLS */
.ball {
  position: absolute;

  background-image: url("image/golfball.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

  opacity: 0;

  transition:
    opacity 1s ease,
    transform 1s cubic-bezier(0.22, 1, 0.36, 1),
    filter 1s ease;

  z-index: 2;
  cursor: pointer;
}

.ball.show {
  opacity: 1;
}

.ball.fade {
  opacity: 0;
  transform: scale(0.85);
  filter: blur(6px);
}
</style>
</head>

<body>

<div id="entry">LOST BALL</div>

<div id="field"></div>

<script>
const entry = document.getElementById("entry");
const field = document.getElementById("field");

const ballCount = 12;

function randomScatter(i) {

  const cols = 3;
  const rows = 4;

  const col = i % cols;
  const row = Math.floor(i / cols);

  let x = (col / (cols - 1)) * 80 + 10;
  let y = (row / (rows - 1)) * 80 + 10;

  x += (Math.random() - 0.5) * 20;
  y += (Math.random() - 0.5) * 20;

  x = Math.max(5, Math.min(90, x));
  y = Math.max(5, Math.min(90, y));

  return { x, y };
}

function createBalls() {

  for (let i = 0; i < ballCount; i++) {

    const ball = document.createElement("div");
    ball.classList.add("ball");

    const pos = randomScatter(i);

    ball.style.left = pos.x + "vw";
    ball.style.top = pos.y + "vh";

    const size = 190 + Math.random() * 10;

    ball.style.width = size + "px";
    ball.style.height = size + "px";

    field.appendChild(ball);

    requestAnimationFrame(() => {
      ball.classList.add("show");
    });

    ball.addEventListener("click", () => {

      ball.style.pointerEvents = "none";
      ball.classList.add("fade");

      setTimeout(() => {

        ball.remove();

        if (field.querySelectorAll(".ball").length === 0) {
          setTimeout(reset, 1200);
        }

      }, 1000);

    });
  }
}

function start() {

  field.classList.add("visible");
  entry.classList.add("fade-out");

  setTimeout(() => {
    createBalls();
  }, 500);

  setTimeout(() => {
    entry.style.display = "none";
  }, 1200);
}

function reset() {
  field.innerHTML = "";
  createBalls();
}

entry.addEventListener("click", start);
</script>

</body>
</html>
