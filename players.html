<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Players</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="players.css">
</head>

<body>

<div class="screen">

  <h2>Players</h2>

  <div id="circles"></div>

  <button class="ok-btn" onclick="goToHole()">OK</button>

</div>

<script>
const count = localStorage.getItem("players") || 1;
const container = document.getElementById("circles");

const images = [
  "image/picking.png",
  "image/eye.png",
  "image/heroimage.png"
];

function randomImage() {
  return images[Math.floor(Math.random() * images.length)];
}

// store players here
let playerData = [];

for (let i = 1; i <= count; i++) {

  const wrapper = document.createElement("div");
  wrapper.className = "circle";

  const img = document.createElement("img");
  img.src = randomImage();

  const input = document.createElement("input");
  input.placeholder = "Player " + i;

  wrapper.appendChild(img);
  wrapper.appendChild(input);

  container.appendChild(wrapper);

  playerData.push({
    name: input,
    image: img.src
  });
}

// go next page
function goToHole() {

  const players = [];

  document.querySelectorAll(".circle").forEach((c) => {
    const name = c.querySelector("input").value || "Player";
    const img = c.querySelector("img").src;

    players.push({ name, img });
  });

  localStorage.setItem("playerData", JSON.stringify(players));

  window.location.href = "hole.html";
}
</script>

</body>
</html>
