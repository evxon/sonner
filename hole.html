<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hole</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hole.css">
</head>

<body>

<div class="top">

  <div class="wrapper">

    <div class="btn hidden" id="back" onclick="prev()">
      &lt;
    </div>

    <div class="hole" id="holeText">
      Hole 1
    </div>

    <div class="btn" onclick="next()">
      &gt;
    </div>

  </div>

</div>

<div class="content">
  <div id="playersContainer"></div>
</div>

<script>
let hole = 1;
const max = 18;

const holeText = document.getElementById("holeText");
const back = document.getElementById("back");

const names =
  JSON.parse(localStorage.getItem("playerNames")) || [];

const images =
  JSON.parse(localStorage.getItem("playerImages")) || [];

const container =
  document.getElementById("playersContainer");

let scores =
  JSON.parse(localStorage.getItem("golfScores")) || {};

function saveScores() {
  localStorage.setItem(
    "golfScores",
    JSON.stringify(scores)
  );
}

function changeScore(playerIndex, amount) {

  if (!scores[hole]) {
    scores[hole] = [];
  }

  let current =
    parseInt(scores[hole][playerIndex] || 0);

  current += amount;

  if (current < 0) {
    current = 0;
  }

  scores[hole][playerIndex] = current;

  saveScores();

  document.getElementById(
    `score-${playerIndex}`
  ).textContent = current;
}

function renderPlayers() {

  container.innerHTML = "";

  names.forEach((name, index) => {

    const score =
      scores[hole]?.[index] || 0;

    const row = document.createElement("div");

    row.className = "player-row";

    row.innerHTML = `
      <img src="${images[index] || 'image/eye.png'}">

      <div class="player-name">
        ${name}
      </div>

      <div class="score-controls">

        <button
          class="score-btn"
          onclick="changeScore(${index}, -1)">
          −
        </button>

        <span
          class="score-value"
          id="score-${index}">
          ${score}
        </span>

        <button
          class="score-btn"
          onclick="changeScore(${index}, 1)">
          +
        </button>

      </div>
    `;

    container.appendChild(row);
  });
}

function update() {

  holeText.textContent =
    "Hole " + hole;

  if (hole === 1) {
    back.classList.add("hidden");
  } else {
    back.classList.remove("hidden");
  }

  renderPlayers();
}

function next() {

  if (hole < max) {
    hole++;
    update();
  }
}

function prev() {

  if (hole > 1) {
    hole--;
    update();
  }
}

update();
</script>

</body>
</html>
