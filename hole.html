<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOREBOARD</title>

<link rel="stylesheet" href="hole.css">
</head>

<body>

<div class="top">
  <div class="wrapper">

    <div class="btn hidden" id="back" onclick="prev()">&lt;</div>
    <div class="hole" id="holeText">Hole 1</div>
    <div class="btn" onclick="next()">&gt;</div>

  </div>
</div>

<div class="content">
  <div id="playersContainer"></div>
</div>

<script>

let hole = 1;
const max = 18;

const playerData = JSON.parse(localStorage.getItem("playerData")) || [];

const container = document.getElementById("playersContainer");
const holeText = document.getElementById("holeText");
const back = document.getElementById("back");

let scores = JSON.parse(localStorage.getItem("golfScores")) || {};

for (let h = 1; h <= 18; h++) {
  if (!scores[h]) scores[h] = [];
  for (let p = 0; p < playerData.length; p++) {
    if (scores[h][p] === undefined) scores[h][p] = 0;
  }
}

function saveScores() {
  localStorage.setItem("golfScores", JSON.stringify(scores));
}

function changeScore(i, val) {
  scores[hole][i] += val;
  document.getElementById(`score-${i}`).textContent = scores[hole][i];
  saveScores();
}

function renderPlayers() {

  container.innerHTML = "";

  playerData.forEach((p, i) => {

    const row = document.createElement("div");
    row.className = "player-row";

    row.innerHTML = `
      <div class="player-avatar">
        <img src="${p.image}">
      </div>

      <div class="player-name">${p.name}</div>

      <div class="score-controls">
        <button onclick="changeScore(${i}, -1)">−</button>
        <span id="score-${i}">${scores[hole][i]}</span>
        <button onclick="changeScore(${i}, 1)">+</button>
      </div>
    `;

    container.appendChild(row);
  });
}

function update() {
  holeText.textContent = `HOLE ${hole}`;
  back.classList.toggle("hidden", hole === 1);
  renderPlayers();
}

function next() {
  if (hole < max) {
    hole++;
    update();
  }
}

function prev() {
  if (hole > 1) {
    hole--;
    update();
  }
}

update();

</script>

</body>
</html>
