<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOREBOARD</title>

<link rel="stylesheet" href="hole.css">

<style>

/* ===== TOP BAR ===== */
.top {
  position: fixed;
  top: 0;
  width: 100%;
  height: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  z-index: 10;
}

.wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  position: relative;
}

.hole {
  font-weight: 500;
  letter-spacing: 1px;
}

/* BACK TO ARCHIVE */
.back-archive {
  position: absolute;
  left: 16px;
  font-size: 12px;
  letter-spacing: 1.5px;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(0,0,0,0.06);
  cursor: pointer;
  display: none;
  user-select: none;
}

/* NEW: MAIN PAGE BUTTON */
.main-page {
  position: absolute;
  left: 16px;
  top: 48px;
  font-size: 11px;
  letter-spacing: 1.5px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(0,0,0,0.04);
  cursor: pointer;
  user-select: none;
  transition: 0.2s ease;
}

.main-page:active {
  transform: scale(0.96);
}

/* NEXT BUTTON */
.next-hole {
  position: absolute;
  right: 16px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* CONTENT */
.content {
  padding-top: 100px;
  padding-bottom: 120px;
}

/* SAVE BAR */
.save-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 90px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
  border-top: 1px solid rgba(0,0,0,0.08);
  z-index: 20;
}

.save-btn {
  width: 90%;
  max-width: 500px;
  height: 50px;
  border-radius: 999px;
  border: none;
  background: black;
  color: white;
  font-size: 16px;
}

/* PLAYER */
.player-row {
  display: flex;
  align-items: center;
  height: 78px;
  margin: 12px auto;
  width: 90%;
  max-width: 700px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  border-radius: 999px;
  padding: 0 20px;
}

.player-avatar img {
  width: 54px;
  height: 54px;
  border-radius: 12px;
  object-fit: cover;
  margin-right: 16px;
}

.player-name {
  flex: 1;
}

.score-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.score-controls button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: #f2f2f2;
}

/* END SCREEN */
#endScreen {
  position: fixed;
  inset: 0;
  background: white;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 999;
  font-family: Inter, sans-serif;
}

#endScreen button {
  padding: 12px 20px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
}

</style>

</head>

<body>

<!-- TOP -->
<div class="top">
  <div class="wrapper">

    <!-- MAIN PAGE BUTTON -->
    <div class="main-page" onclick="goMain()">MAIN</div>

    <!-- BACK TO ARCHIVE (only in edit mode) -->
    <div class="back-archive" id="backBtn">GO BACK TO ARCHIVE</div>

    <div class="hole" id="holeText">HOLE 1</div>

    <div class="next-hole" id="nextBtn">&gt;</div>

  </div>
</div>

<!-- CONTENT -->
<div class="content">
  <div id="playersContainer"></div>
</div>

<!-- SAVE -->
<div class="save-bar">
  <button class="save-btn" id="saveBtn">SAVE SCORE</button>
</div>

<!-- END SCREEN -->
<div id="endScreen">
  <h2>Round Complete</h2>

  <button onclick="window.location.href='score.html'" style="background:black; color:white;">
    Go to Scoreboard
  </button>

  <button onclick="window.location.href='archive.html'" style="background:#eee;">
    Archive
  </button>

  <button onclick="window.location.href='test.html'" style="background:#f5f5f5;">
    Cool off
  </button>
</div>

<script>

let hole = 1;
const max = 18;

const playerData = JSON.parse(localStorage.getItem("playerData")) || [];
const container = document.getElementById("playersContainer");
const holeText = document.getElementById("holeText");
const saveBtn = document.getElementById("saveBtn");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

const fromArchive = localStorage.getItem("editMode") === "true";

if (fromArchive) {
  backBtn.style.display = "inline-flex";
}

/* ===== MAIN PAGE NAV ===== */
function goMain() {
  window.location.href = "score.html";
}

/* BACK TO ARCHIVE */
backBtn.addEventListener("click", () => {
  localStorage.removeItem("editMode");
  localStorage.removeItem("activeArchiveIndex");
  window.location.href = "archive.html";
});

/* SCORES */
let savedScores = JSON.parse(localStorage.getItem("golfScores")) || {};
let draftScores = {};

for (let h = 1; h <= max; h++) {
  if (!savedScores[h]) savedScores[h] = [];
  if (!draftScores[h]) draftScores[h] = [];

  for (let p = 0; p < playerData.length; p++) {
    savedScores[h][p] = Number(savedScores[h][p] || 0);
    draftScores[h][p] = savedScores[h][p];
  }
}

function changeScore(i, val) {
  draftScores[hole][i] = (Number(draftScores[hole][i]) || 0) + val;
  document.getElementById(`score-${i}`).textContent = draftScores[hole][i];
}

function renderPlayers() {
  container.innerHTML = "";

  playerData.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "player-row";

    row.innerHTML = `
      <div class="player-avatar">
        <img src="${p.image}">
      </div>

      <div class="player-name">${p.name || "Player " + (i + 1)}</div>

      <div class="score-controls">
        <button data-i="${i}" data-v="-1">−</button>
        <span id="score-${i}">${draftScores[hole][i]}</span>
        <button data-i="${i}" data-v="1">+</button>
      </div>
    `;

    container.appendChild(row);
  });
}

container.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  changeScore(Number(btn.dataset.i), Number(btn.dataset.v));
});

/* SAVE */
function saveHole() {
  for (let i = 0; i < playerData.length; i++) {
    savedScores[hole][i] = draftScores[hole][i];
  }

  localStorage.setItem("golfScores", JSON.stringify(savedScores));

  saveBtn.textContent = "SAVED ✔";
  setTimeout(() => saveBtn.textContent = "SAVE SCORE", 800);
}

/* NEXT HOLE */
nextBtn.addEventListener("click", () => {

  if (hole === max) {
    document.querySelector(".top").style.display = "none";
    document.querySelector(".content").style.display = "none";
    document.querySelector(".save-bar").style.display = "none";

    document.getElementById("endScreen").style.display = "flex";
    return;
  }

  hole++;
  update();
});

function update() {
  holeText.textContent = `HOLE ${hole}`;
  renderPlayers();
}

saveBtn.addEventListener("click", saveHole);

update();

</script>

</body>
</html>
