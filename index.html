<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scoreboard</title>

<!-- TAB ICON -->
<link rel="icon" type="image/png" href="image/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="score.css">
</head>

<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="container">

    <h1>Welcome</h1>
    <p class="subtitle">Login to save your rounds.</p>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <div class="auth-buttons">
      <button onclick="createAccount()">Create Account</button>
      <button onclick="login()">Log In</button>
    </div>

  </div>
</div>

<!-- HERO -->
<section id="heroScreen" style="display:none;">
  <div class="hero-content">

    <h1>Scoreboard</h1>

    <p class="subtitle">
      Record every round. Track every shot.
    </p>

    <button onclick="showSetup()">Start Round</button>
    <button onclick="openArchive()">My Archive</button>

  </div>
</section>

<!-- SETUP -->
<section id="setupScreen" class="container" style="display:none;">

  <h1>Who's playing?</h1>

  <div class="player-inputs">
    <input id="player1" placeholder="Player 1">
    <input id="player2" placeholder="Player 2">
    <input id="player3" placeholder="Player 3">
    <input id="player4" placeholder="Player 4">
  </div>

  <button onclick="startRound()">Begin Round</button>

</section>

<!-- ROUND -->
<section id="roundScreen" class="container" style="display:none;">

  <div class="round-nav">
    <button onclick="previousHole()">←</button>
    <div id="roundLabel">R1</div>
    <button onclick="nextHole()">→</button>
  </div>

  <div id="playerScores"></div>

  <button onclick="finishRound()">Finish Round</button>

</section>

<!-- RESULTS -->
<section id="resultsScreen" class="container" style="display:none;">

  <h3>Round Complete</h3>
  <div id="playerResults"></div>

</section>

<!-- ARCHIVE -->
<section id="archiveScreen" class="container" style="display:none;">

  <h3>Archive</h3>
  <div id="archiveList"></div>

</section>

<script>
/* =========================
   STATE
========================= */

let players = [];
let currentHole = 1;
let scores = {};

/* =========================
   NAVIGATION
========================= */

function showSetup(){
  hideAll();
  document.getElementById("setupScreen").style.display = "block";
}

function openArchive(){
  hideAll();
  document.getElementById("archiveScreen").style.display = "block";
  if (typeof loadArchive === "function") loadArchive();
}

function hideAll(){
  ["heroScreen","setupScreen","roundScreen","resultsScreen","archiveScreen"]
  .forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

/* =========================
   START ROUND
========================= */

function startRound(){

  players = [];

  for(let i=1;i<=4;i++){
    const name = document.getElementById("player"+i).value;
    if(name) players.push(name);
  }

  if(players.length === 0){
    alert("Add players");
    return;
  }

  players.forEach(p => scores[p] = Array(18).fill(""));

  hideAll();
  document.getElementById("roundScreen").style.display = "block";

  renderHole();
}

/* =========================
   RENDER HOLE
========================= */

function renderHole(){

  document.getElementById("roundLabel").innerText = "R" + currentHole;

  let html = "";

  players.forEach(p => {

    html += `
      <div class="player-row">
        <div class="player-name">${p}</div>

        <input type="number"
          class="score-input"
          value="${scores[p][currentHole-1]}"
          onchange="updateScore('${p}', this.value)">
      </div>
    `;
  });

  document.getElementById("playerScores").innerHTML = html;
}

/* =========================
   SCORE UPDATE
========================= */

function updateScore(player, value){
  scores[player][currentHole-1] = value;
}

/* =========================
   NEXT / PREV (FIXED)
========================= */

function nextHole(){
  saveInputs();
  if(currentHole < 18){
    currentHole++;
    renderHole();
  }
}

function previousHole(){
  saveInputs();
  if(currentHole > 1){
    currentHole--;
    renderHole();
  }
}

function saveInputs(){
  const inputs = document.querySelectorAll(".score-input");

  inputs.forEach((input, i) => {
    const player = players[i];
    scores[player][currentHole-1] = input.value;
  });
}

/* =========================
   FINISH ROUND
========================= */

function finishRound(){

  saveInputs();

  let result = players.map(p => {

    let total = 0;

    scores[p].forEach(v => {
      let n = parseInt(v);
      if(!isNaN(n)) total += n;
    });

    return { name: p, score: total };
  });

  hideAll();
  document.getElementById("resultsScreen").style.display = "block";

  document.getElementById("playerResults").innerHTML =
    result.map(r => `<div>${r.name} — ${r.score}</div>`).join("");

  if(typeof saveToFirebase === "function"){
    saveToFirebase(result);
  }
}
</script>

<!-- AUTH + FIREBASE -->
<script type="module" src="auth.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
