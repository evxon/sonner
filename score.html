<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: 'Inter', sans-serif;
  background: #fff;
}

/* ================= ARCHIVE BUTTON ================= */
.archive-bar {
  position: fixed;
  bottom: 28px;
  right: 20px;

  width: 140px;
  height: 44px;

  background: rgba(0,0,0,0.88);
  color: white;

  border-radius: 999px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;
  z-index: 6000;

  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);

  transition: opacity 0.35s ease, transform 0.35s ease;
}

.archive-bar.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
}

/* ================= LAYOUT ================= */
.section {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* ================= CARD ================= */
.card {
  width: 320px;
  height: 320px;
  border-radius: 28px;
  background: #fff;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

label {
  font-size: 14px;
  color: #888;
  margin-bottom: 8px;
}

select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-bottom: 1px solid #ddd;
  background: transparent;
  outline: none;
  font-size: 16px;
}

button {
  margin-top: 24px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
}

/* ================= PLAYERS ================= */
#playerContainer {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 40px;
  flex-wrap: nowrap;
}

#playerContainer.grid-4 {
  display: flex !important;
  flex-wrap: nowrap;
}

.player-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
              opacity 0.6s ease;
}

.player-card.stack {
  transform: translateY(-40px) scale(0.82);
  opacity: 0;
}

.player-circle {
  width: 120px;
  height: 120px;
  border-radius: 24px;
  overflow: hidden;
}

.player-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-card input {
  width: 120px;
  margin-top: 12px;
  border: none;
  border-bottom: 1px solid #ddd;
  text-align: center;
  outline: none;
  font-size: 16px;
}

/* ================= NEXT ================= */
#nextWrap {
  margin-top: 40px;
}

#nextBtn {
  transition: opacity 0.4s ease, transform 0.4s ease;
}

#nextBtn.fade {
  opacity: 0;
  transform: scale(0.95);
}

/* ================= TOAST ================= */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,0.92);
  color: white;
  padding: 14px 22px;
  border-radius: 999px;
  opacity: 0;
  transition: 0.4s;
  z-index: 9999;
  font-size: 14px;
}

#toast.show {
  opacity: 1;
}

/* blur */
#playerContainer.transitioning {
  filter: blur(10px);
  transition: filter 0.6s ease;
}

/* ================= MOBILE ================= */
@media (max-width: 480px) {
  #playerContainer {
    flex-wrap: wrap;
    gap: 30px;
  }
}

</style>
</head>

<body>

<div id="toast">Successfully logged in</div>

<div class="archive-bar" onclick="goArchive()">ARCHIVE</div>

<!-- SETUP -->
<section class="section" id="setupSection">

  <div class="card">

    <label>Players</label>

    <select id="players">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
    </select>

    <button onclick="showPlayers()">OK</button>

  </div>

</section>

<!-- PLAYERS -->
<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>

let playerData = [];

/* SHOW PLAYERS */
function showPlayers() {

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";
  container.classList.toggle("grid-4", count === 4);

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  const used = [];
  playerData = [];

  for (let i = 0; i < count; i++) {

    let available = images.filter(img => !used.includes(img));
    if (!available.length) available = images;

    const img = available[Math.floor(Math.random() * available.length)];
    used.push(img);

    playerData.push({ name: "", image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection")
    .scrollIntoView({ behavior: "smooth" });

  updateArchiveVisibility(); // 🔥 important
}

/* NEXT */
function goToHole() {

  const inputs = document.querySelectorAll(".player-card input");

  const players = [];

  inputs.forEach((input, i) => {
    const name = input.value.trim();

    players.push({
      name: name !== "" ? name : `Player ${i + 1}`,
      image: playerData[i].image
    });
  });

  const newRound = {
    date: new Date().toISOString(),
    players,
    scores: {}
  };

  let archives = JSON.parse(localStorage.getItem("golfArchives")) || [];
  archives.push(newRound);
  localStorage.setItem("golfArchives", JSON.stringify(archives));

  localStorage.setItem("playerData", JSON.stringify(players));
  localStorage.setItem("activeRound", "true");

  const container = document.getElementById("playerContainer");
  const cards = document.querySelectorAll(".player-card");
  const nextBtn = document.getElementById("nextBtn");

  container.classList.add("transitioning");
  nextBtn.classList.add("fade");

  cards.forEach((card, i) => {
    setTimeout(() => {
      card.classList.add("stack");
    }, i * 120);
  });

  setTimeout(() => {
    window.location.href = "hole.html";
  }, 1200);
}

/* ARCHIVE */
function goArchive() {
  window.location.href = "archive.html";
}

/* ================= FIX: PROPER SCROLL VISIBILITY ================= */
const archiveBtn = document.querySelector(".archive-bar");
const setupSection = document.getElementById("setupSection");

function updateArchiveVisibility() {
  const rect = setupSection.getBoundingClientRect();

  // visible ONLY when first screen is in view
  if (rect.bottom > 100 && rect.top < window.innerHeight - 100) {
    archiveBtn.classList.remove("hidden");
  } else {
    archiveBtn.classList.add("hidden");
  }
}

window.addEventListener("scroll", updateArchiveVisibility);
window.addEventListener("resize", updateArchiveVisibility);
window.addEventListener("load", updateArchiveVisibility);

/* TOAST */
window.addEventListener("DOMContentLoaded", () => {
  const t = document.getElementById("toast");
  setTimeout(() => t.classList.add("show"), 300);
  setTimeout(() => t.classList.remove("show"), 2500);
});

</script>

</body>
</html>
