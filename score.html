<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="score.css">

<style>

/* ===== ARCHIVE (APPLE FLOATING BUTTON FIXED POSITION) ===== */
.archive-bar {
  position: fixed;
  bottom: 28px;
  right: 20px;

  width: 140px;
  height: 44px;

  background: rgba(0,0,0,0.88);
  color: white;

  border-radius: 999px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 12px;
  letter-spacing: 2px;

  cursor: pointer;

  z-index: 6000;

  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.archive-bar:active {
  transform: scale(0.96);
}

</style>

</head>

<body>

<div id="blur"></div>
<div id="toast">Successfully logged in</div>

<!-- ARCHIVE BUTTON (FIXED POSITION BOTTOM RIGHT) -->
<div class="archive-bar" onclick="goArchive()">ARCHIVE</div>

<section class="section">

  <div class="card">

    <label>Players</label>

    <select id="players">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
    </select>

    <button onclick="showPlayers()">OK</button>

  </div>

</section>

<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>

let playerData = [];

function showPlayers() {

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";
  container.classList.toggle("grid-4", count === 4);

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  const used = [];
  playerData = [];

  for (let i = 0; i < count; i++) {

    let available = images.filter(img => !used.includes(img));
    if (!available.length) available = images;

    const img = available[Math.floor(Math.random() * available.length)];
    used.push(img);

    playerData.push({ name: "", image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection")
    .scrollIntoView({ behavior: "smooth" });
}

function goToHole() {

  const inputs = document.querySelectorAll(".player-card input");

  let validPlayers = 0;

  inputs.forEach((input, i) => {
    const name = input.value.trim();

    if (name !== "") {
      validPlayers++;
      playerData[i].name = name;
    } else {
      playerData[i].name = `Player ${i + 1}`;
    }
  });

  // 🚨 ONLY ALLOW SESSION START IF AT LEAST 1 REAL NAME IS ENTERED
  const hasRealInput = Array.from(inputs).some(i => i.value.trim() !== "");

  if (!hasRealInput) {
    alert("Please enter at least one player name before continuing");
    return;
  }

  // mark this as a valid session (NOT archive yet)
  localStorage.setItem("playerData", JSON.stringify(playerData));
  localStorage.setItem("activeRound", "true");

  window.location.href = "hole.html";
}

function goArchive() {
  window.location.href = "archive.html";
}

window.addEventListener("DOMContentLoaded", () => {
  const t = document.getElementById("toast");
  setTimeout(() => t.classList.add("show"), 300);
  setTimeout(() => t.classList.remove("show"), 2500);
});

</script>

</body>
</html>
