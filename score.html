<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="score.css">
</head>

<body>

<div id="toast">Successfully logged in</div>

<section class="section">

  <div class="card">

    <h1></h1>
    <p></p>

    <label>Players</label>

    <select id="players">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
    </select>

    <button onclick="showPlayers()">OK</button>

  </div>

</section>

<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>

let playerData = [];

function showPlayers() {

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";
  container.classList.toggle("grid-4", count === 4);

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  const used = [];
  playerData = [];

  for (let i = 0; i < count; i++) {

    let available = images.filter(img => !used.includes(img));
    if (!available.length) available = images;

    const img = available[Math.floor(Math.random() * available.length)];
    used.push(img);

    playerData.push({ name: "", image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection").scrollIntoView({
    behavior: "smooth"
  });
}


/* =========================
   🍎 APPLE STYLE STACK ANIMATION
========================= */

function goToHole() {

  // hide button instantly
  const btn = document.getElementById("nextBtn");
  btn.style.opacity = "0";
  btn.style.pointerEvents = "none";

  const cards = [...document.querySelectorAll(".player-card")];
  const inputs = document.querySelectorAll(".player-card input");

  // save names
  inputs.forEach((input, i) => {
    playerData[i].name = input.value.trim() || `Player ${i + 1}`;
  });

  localStorage.setItem("playerData", JSON.stringify(playerData));

  // get final positions
  const positions = cards.map(c => {
    const r = c.getBoundingClientRect();
    return {
      el: c,
      x: r.left,
      y: r.top,
      w: r.width,
      h: r.height
    };
  });

  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  // freeze layout first
  cards.forEach((c, i) => {
    const p = positions[i];

    c.style.position = "fixed";
    c.style.left = p.x + "px";
    c.style.top = p.y + "px";
    c.style.margin = "0";
    c.style.zIndex = 1000 + i;
    c.style.transition = "none";
  });

  // force layout lock
  void document.body.offsetHeight;

  // smooth Apple-like animation
  cards.forEach((c, i) => {

    const p = positions[i];

    const dx = cx - (p.x + p.w / 2);
    const dy = cy - (p.y + p.h / 2);

    c.style.transition =
      "transform 2.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.8s ease";

    setTimeout(() => {

      c.style.transform = `
        translate(${dx}px, ${dy}px)
        scale(0.88)
      `;

      c.style.opacity = "0";

      const img = c.querySelector("img");
      const input = c.querySelector("input");

      if (img) img.style.opacity = "0";
      if (input) input.style.opacity = "0";

    }, i * 80);
  });

  // delay navigation (slow Apple feel)
  setTimeout(() => {
    window.location.href = "hole.html";
  }, 2800);
}


/* toast */
window.addEventListener("DOMContentLoaded", () => {
  const t = document.getElementById("toast");
  setTimeout(() => t.classList.add("show"), 300);
  setTimeout(() => t.classList.remove("show"), 2500);
});

</script>

</body>
</html>
