<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="score.css"></head>

<body>

<div id="toast">Successfully logged in</div>

<!-- SETUP -->
<div class="center-wrap" id="setupScreen">

  <div class="setup-content">

    <div class="top-archive" id="archive">
<div class="archive-card-top" onclick="goArchive()">
  Archive
</div>

    </div>

    <div class="card">

    <label>Players</label>

    <select id="players">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
    </select>

    <button onclick="showPlayers()">OK</button>
  </div>

</div>
</div>

<!-- PLAYERS -->
<section id="playersSection">
  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>
</section>

<script>

let playerData = [];
let mode = "setup"; // 👈 IMPORTANT STATE

function goArchive() {
  window.location.href = "archive.html";
}

/* ================= ARCHIVE VISIBILITY CONTROL ================= */
function updateArchiveVisibility() {
  const archive = document.getElementById("archive");

  if (mode === "setup") {
    archive.classList.remove("hidden");
  } else {
    archive.classList.add("hidden");
  }
}

/* ================= SHOW PLAYERS ================= */
function showPlayers() {

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";

  container.className = "";

if (count === 3) {
  container.classList.add("layout-3");
}

if (count === 4) {
  container.classList.add("layout-4");
}

if (count === 5) {
  container.classList.add("layout-5");
}

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  playerData = [];

  for (let i = 0; i < count; i++) {
    const img = images[i % images.length];
    playerData.push({ image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection")
    .scrollIntoView({ behavior: "smooth" });
}

/* ================= BACK TO SETUP WHEN SCROLLING UP ================= */
window.addEventListener("scroll", () => {

  const playersSection = document.getElementById("playersSection");
  const rect = playersSection.getBoundingClientRect();

  if (rect.top > window.innerHeight * 0.8) {
    mode = "setup";
  } else {
    mode = "players";
  }

  updateArchiveVisibility();
});

/* ================= NEXT STACK ================= */
function goToHole() {

  const cards = document.querySelectorAll(".player-card");
  const button = document.getElementById("nextBtn");

  button.classList.add("fade");

  cards.forEach((card, i) => {
    setTimeout(() => {
      card.classList.add("stack");
    }, i * 120);
  });

  setTimeout(() => {
    const inputs = document.querySelectorAll(".player-card input");

    const players = [];

    inputs.forEach((input, i) => {
      const name = input.value.trim();
      players.push({
        name: name !== "" ? name : `Player ${i + 1}`,
        image: playerData[i].image
      });
    });

    localStorage.setItem("playerData", JSON.stringify(players));
    localStorage.setItem("activeRound", "true");

    window.location.href = "hole.html";
  }, 1200);
}

/* TOAST */
window.addEventListener("DOMContentLoaded", () => {

  const t = document.getElementById("toast");

  if (!sessionStorage.getItem("loginToastShown")) {

    setTimeout(() => t.classList.add("show"), 300);
    setTimeout(() => t.classList.remove("show"), 2500);

    sessionStorage.setItem("loginToastShown", "true");
  }

  updateArchiveVisibility();
});

</script>

</body>
</html>
