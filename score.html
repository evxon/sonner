<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: 'Inter', sans-serif;
  background: #fff;
  overflow-x: hidden;
}

/* ================= SECTION ================= */
.section {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* ================= LABELS (MOVED ABOVE BOXES) ================= */
.top-labels {
  display: flex;
  gap: 40px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #888;
  margin-bottom: 18px;
}

.top-labels span.active {
  color: #111;
}

/* ================= CARDS ================= */
.card, .archive-card {
  width: 320px;
  height: 320px;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: transform 0.6s ease, opacity 0.6s ease;
  position: absolute;
  top: 0;
  left: 0;
}

.card {
  background: #fff;
}

.archive-card {
  background: rgba(0,0,0,0.88);
  color: white;
  align-items: center;
  justify-content: center;
  letter-spacing: 2px;
  font-size: 12px;
  cursor: pointer;
}

/* ================= CAROUSEL ================= */
.carousel {
  position: relative;
  width: 320px;
  height: 340px;
}

/* overlap states */
.state-setup .card {
  transform: translateX(0) scale(1);
  z-index: 2;
}

.state-setup .archive-card {
  transform: translateX(40px) scale(0.92);
  opacity: 0.6;
}

.state-archive .card {
  transform: translateX(-40px) scale(0.92);
  opacity: 0.6;
}

.state-archive .archive-card {
  transform: translateX(0) scale(1);
  z-index: 2;
}

/* ================= DOTS ================= */
.dots {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.dot {
  height: 6px;
  width: 6px;
  border-radius: 999px;
  background: #bbb;
  transition: all 0.3s ease;
  cursor: pointer;
}

.dot.active {
  width: 18px;
  background: #111;
}

/* ================= FORM ================= */
label {
  font-size: 14px;
  color: #888;
  margin-bottom: 8px;
}

select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-bottom: 1px solid #ddd;
  background: transparent;
  outline: none;
  font-size: 16px;
}

button {
  margin-top: 24px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
}

/* ================= PLAYERS ================= */
#playerContainer {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 40px;
}

.player-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
              opacity 0.6s ease;
}

.player-card.stack {
  transform: translateY(-40px) scale(0.82);
  opacity: 0;
}

.player-circle {
  width: 120px;
  height: 120px;
  border-radius: 24px;
  overflow: hidden;
}

.player-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-card input {
  width: 120px;
  margin-top: 12px;
  border: none;
  border-bottom: 1px solid #ddd;
  text-align: center;
  outline: none;
  font-size: 16px;
}

/* NEXT */
#nextWrap {
  margin-top: 40px;
}

#nextBtn.fade {
  opacity: 0;
  transform: scale(0.95);
  transition: 0.4s ease;
}

/* blur */
#playerContainer.transitioning {
  filter: blur(10px);
  transition: filter 0.6s ease;
}

/* ================= TOAST ================= */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,0.92);
  color: white;
  padding: 14px 22px;
  border-radius: 999px;
  opacity: 0;
  transition: 0.4s;
  z-index: 9999;
  font-size: 14px;
}

#toast.show {
  opacity: 1;
}

/* ================= MOBILE ================= */
@media (max-width: 480px) {
  .carousel {
    transform: scale(0.95);
  }
}

</style>
</head>

<body>

<div id="toast">Successfully logged in</div>

<!-- SETUP -->
<section class="section" id="setupSection">

  <!-- LABELS NOW ABOVE BOXES (NOT FIXED) -->
  <div class="top-labels">
    <span id="labelSetup" class="active">NEW SCOREBOARD</span>
    <span id="labelArchive">ARCHIVE</span>
  </div>

  <div class="carousel state-setup" id="carousel">

    <div class="card">

      <label>Players</label>

      <select id="players">
        <option value="1">1 Player</option>
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
        <option value="5">5 Players</option>
      </select>

      <button onclick="showPlayers()">OK</button>

    </div>

    <div class="archive-card" onclick="goArchive()">
      ARCHIVE
    </div>

  </div>

  <div class="dots">
    <div class="dot active" id="dotSetup" onclick="setState('setup')"></div>
    <div class="dot" id="dotArchive" onclick="setState('archive')"></div>
  </div>

</section>

<!-- PLAYERS -->
<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>

let playerData = [];
let state = "setup";

/* SWIPE */
const carousel = document.getElementById("carousel");

let startX = 0;

carousel.addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX;
});

carousel.addEventListener("touchend", (e) => {
  let diff = e.changedTouches[0].clientX - startX;
  if (Math.abs(diff) > 50) {
    setState(diff < 0 ? "archive" : "setup");
  }
});

/* STATE */
function setState(newState) {
  state = newState;

  carousel.classList.remove("state-setup", "state-archive");
  carousel.classList.add("state-" + state);

  document.getElementById("dotSetup").classList.toggle("active", state === "setup");
  document.getElementById("dotArchive").classList.toggle("active", state === "archive");

  document.getElementById("labelSetup").classList.toggle("active", state === "setup");
  document.getElementById("labelArchive").classList.toggle("active", state === "archive");
}

/* ARCHIVE */
function goArchive() {
  window.location.href = "archive.html";
}

/* PLAYERS */
function showPlayers() {

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  playerData = [];

  for (let i = 0; i < count; i++) {

    const img = images[i % images.length];
    playerData.push({ image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection")
    .scrollIntoView({ behavior: "smooth" });
}

/* NEXT */
function goToHole() {

  const inputs = document.querySelectorAll(".player-card input");

  const players = [];

  inputs.forEach((input, i) => {
    const name = input.value.trim();
    players.push({
      name: name !== "" ? name : `Player ${i + 1}`,
      image: playerData[i].image
    });
  });

  const container = document.getElementById("playerContainer");
  const cards = document.querySelectorAll(".player-card");
  const nextBtn = document.getElementById("nextBtn");

  container.classList.add("transitioning");
  nextBtn.classList.add("fade");

  cards.forEach((card, i) => {
    setTimeout(() => {
      card.classList.add("stack");
    }, i * 120);
  });

  setTimeout(() => {
    localStorage.setItem("playerData", JSON.stringify(players));
    localStorage.setItem("activeRound", "true");
    window.location.href = "hole.html";
  }, 1200);
}

/* TOAST */
window.addEventListener("DOMContentLoaded", () => {
  const t = document.getElementById("toast");
  setTimeout(() => t.classList.add("show"), 300);
  setTimeout(() => t.classList.remove("show"), 2500);
});

</script>

</body>
</html>
