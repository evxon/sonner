<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="score.css">
</head>

<body>

<div id="blur"></div>
<div id="toast">Successfully logged in</div>

<section class="section">

  <div class="card">

    <h1></h1>
    <p></p>

    <label>Players</label>

    <select id="players">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
    </select>

    <button onclick="showPlayers()">OK</button>

  </div>

</section>

<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>

let playerData = [];

function showPlayers() {

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";
  container.classList.toggle("grid-4", count === 4);

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  const used = [];
  playerData = [];

  for (let i = 0; i < count; i++) {

    let available = images.filter(img => !used.includes(img));
    if (!available.length) available = images;

    const img = available[Math.floor(Math.random() * available.length)];
    used.push(img);

    playerData.push({ name: "", image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection")
    .scrollIntoView({ behavior: "smooth" });
}

function goToHole() {

  const btn = document.getElementById("nextBtn");
  btn.style.opacity = "0";
  btn.style.pointerEvents = "none";

  document.getElementById("blur").classList.add("active");

  const cards = [...document.querySelectorAll(".player-card")];
  const inputs = document.querySelectorAll(".player-card input");

  inputs.forEach((input, i) => {
    playerData[i].name = input.value.trim() || `Player ${i + 1}`;
  });

  localStorage.setItem("playerData", JSON.stringify(playerData));

  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const positions = cards.map(c => {
    const r = c.getBoundingClientRect();
    return { el: c, x: r.left, y: r.top, w: r.width, h: r.height };
  });

  cards.forEach((c, i) => {
    const p = positions[i];

    c.style.position = "fixed";
    c.style.left = p.x + "px";
    c.style.top = p.y + "px";
    c.style.margin = "0";
    c.style.transformOrigin = "center";
    c.style.zIndex = 1000 + i;
  });

  void document.body.offsetHeight;

  cards.forEach((c, i) => {

    const p = positions[i];

    const dx = centerX - (p.x + p.w / 2);
    const dy = centerY - (p.y + p.h / 2);

    const rotate = (Math.random() - 0.5) * 6;

    setTimeout(() => {

      c.style.transition =
        "transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.2s ease";

      c.style.transform =
        `translate(${dx}px, ${dy}px) scale(0.85) rotate(${rotate}deg)`;

      c.style.opacity = "0";

      const img = c.querySelector("img");
      const input = c.querySelector("input");

      if (img) img.style.opacity = "0";
      if (input) input.style.opacity = "0";

    }, i * 140);
  });

  setTimeout(() => {
    window.location.href = "hole.html";
  }, 1200);
}

window.addEventListener("DOMContentLoaded", () => {
  const t = document.getElementById("toast");
  setTimeout(() => t.classList.add("show"), 300);
  setTimeout(() => t.classList.remove("show"), 2500);
});

</script>

</body>
</html>
