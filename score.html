<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="score.css">
</head>

<body>

<div id="toast">Successfully logged in</div>

<section class="section">

  <div class="card">

    <h1></h1>
    <p></p>

    <div class="select-box">

      <label>Players</label>

      <select id="players">
        <option value="1">1 Player</option>
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
        <option value="5">5 Players</option>
      </select>

    </div>

    <button onclick="showPlayers()">OK</button>

  </div>

</section>

<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextSection">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>

function showPlayers() {

  const count = parseInt(document.getElementById("players").value);
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  const availableImages = [...images];
  const playerData = [];

  for (let i = 1; i <= count; i++) {

    if (availableImages.length === 0) {
      availableImages.push(...images);
    }

    const randomIndex = Math.floor(Math.random() * availableImages.length);
    const image = availableImages.splice(randomIndex, 1)[0];

    const name = `Player ${i}`;

    playerData.push({ name, image });

    const player = document.createElement("div");
    player.className = "player-card";

    player.innerHTML = `
      <div class="player-circle">
        <img src="${image}" alt="Player">
      </div>
      <input type="text" value="${name}" placeholder="${name}">
    `;

    container.appendChild(player);
  }

  localStorage.setItem("playerData", JSON.stringify(playerData));

  document.getElementById("playersSection").scrollIntoView({
    behavior: "smooth"
  });
}

function goToHole() {

  const inputs = document.querySelectorAll(".player-card input");
  const data = JSON.parse(localStorage.getItem("playerData")) || [];

  inputs.forEach((input, i) => {
    if (data[i]) {
      data[i].name = input.value || input.placeholder;
    }
  });

  localStorage.setItem("playerData", JSON.stringify(data));

  window.location.href = "hole.html";
}

window.addEventListener("DOMContentLoaded", () => {

  const toast = document.getElementById("toast");

  setTimeout(() => toast.classList.add("show"), 200);
  setTimeout(() => toast.classList.remove("show"), 3000);

});

</script>

</body>
</html>
