<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scoreboard</title>

<link rel="icon" type="image/jpeg" href="image/SØNNER LOGO.JPG">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="score.css">
</head>

<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="container">

    <h1>Welcome</h1>

    <p class="subtitle">Create an account or log in to save rounds.</p>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <div class="auth-buttons">
      <button onclick="createAccount()">Create Account</button>
      <button onclick="login()">Log In</button>
    </div>

  </div>
</div>

<!-- HERO -->
<section id="heroScreen">

  <div class="hero-image">
    <img src="image/heroimage.png">
  </div>

  <div class="hero-content">

    <h1>Scoreboard</h1>

    <p class="subtitle">Record rounds. Track every shot.</p>

    <button onclick="showSetup()">Start Round</button>

  </div>

</section>

<!-- SETUP -->
<section id="setupScreen" class="container">

  <h1>Who's on the card?</h1>

  <p class="subtitle">Enter players before starting.</p>

  <div class="player-inputs">
    <input id="player1" placeholder="Player 1">
    <input id="player2" placeholder="Player 2">
    <input id="player3" placeholder="Player 3">
    <input id="player4" placeholder="Player 4">
  </div>

  <button onclick="startRound()">Begin Round</button>

</section>

<!-- ROUND -->
<section id="roundScreen" class="container">

  <div class="round-nav">
    <button onclick="previousHole()">←</button>
    <div id="roundLabel">R1</div>
    <button onclick="nextHole()">→</button>
  </div>

  <div id="playerScores"></div>

  <button id="finishButton" onclick="finishRound()">Complete Round</button>

</section>

<!-- RESULTS -->
<section id="resultsScreen" class="container">

  <h3>Round Complete</h3>
  <div id="playerResults"></div>

</section>

<!-- 🟢 ARCHIVE SECTION -->
<section id="archiveScreen" class="container">

  <h3>Your Archive</h3>

  <div id="archiveList"></div>

</section>

<script>
let players = [];
let currentHole = 1;
let scores = {};
let currentUser = null;

/* SHOW SETUP */
function showSetup(){
  document.getElementById('heroScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'block';
}

/* START ROUND */
function startRound(){

  players = [];

  for(let i=1;i<=4;i++){
    let name = document.getElementById(`player${i}`).value;
    if(name) players.push(name);
  }

  if(players.length === 0){
    alert("Add players");
    return;
  }

  players.forEach(p => scores[p] = Array(18).fill(''));

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('roundScreen').style.display = 'block';

  renderHole();
}

/* RENDER HOLE */
function renderHole(){

  document.getElementById('roundLabel').innerText = `R${currentHole}`;

  let html = '';

  players.forEach(p => {

    html += `
      <div class="player-row">
        <div>${p}</div>
        <input type="number"
          class="score-input"
          onchange="updateScore('${p}', this.value)">
      </div>
    `;
  });

  document.getElementById('playerScores').innerHTML = html;
}

/* FINISH ROUND */
function finishRound(){

  let result = [];

  players.forEach(p => {

    let total = 0;

    scores[p].forEach(s => {
      let v = parseInt(s);
      if(!isNaN(v)) total += v;
    });

    result.push({ name: p, score: total });
  });

  document.getElementById('roundScreen').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'block';

  saveToFirebase(result); // 🔥 SAVE
}

/* ARCHIVE */
function loadArchive(){}

/* DELETE */
function deleteRound(id){}
</script>

<script type="module" src="auth.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
