<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCOREBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: 'Inter', sans-serif;
  background: #fff;
  overflow-x: hidden;
  height: 100%;
}

/* ================= ARCHIVE ================= */
.top-archive {
  position: fixed;
  top: 40px;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 10;

  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.top-archive.hidden {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
}

.archive-card-top {
  width: 320px;
  height: 80px;
  border-radius: 20px;
  background: rgba(0,0,0,0.88);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 2px;
  font-size: 12px;
  cursor: pointer;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
}

/* ================= CENTER ================= */
.center-wrap {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ================= CARD ================= */
.card {
  width: 320px;
  height: 320px;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: #fff;
}

/* ================= FORM ================= */
label {
  font-size: 14px;
  color: #888;
  margin-bottom: 8px;
}

select {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-bottom: 1px solid #ddd;
  background: transparent;
  outline: none;
  font-size: 16px;
}

button {
  margin-top: 24px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
}

/* ================= PLAYERS ================= */
#playersSection {
  padding-top: 25vh;
  padding-bottom: 25vh;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#playerContainer {
  display: flex;
  gap: 40px;
  justify-content: center;
  align-items: center;
}

/* ================= PLAYER CARD ================= */
.player-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
              opacity 0.6s ease;
}

.player-circle {
  width: 120px;
  height: 120px;
  border-radius: 24px;
  overflow: hidden;
}

.player-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-card input {
  width: 120px;
  margin-top: 12px;
  border: none;
  border-bottom: 1px solid #ddd;
  text-align: center;
  outline: none;
  font-size: 16px;
}

/* STACK ANIMATION */
.player-card.stack {
  transform: translateY(-60px) scale(0.7);
  opacity: 0;
}

/* ================= NEXT ================= */
#nextWrap {
  margin-top: 40px;
}

button.fade {
  opacity: 0;
  transform: scale(0.95);
  transition: 0.4s ease;
}

/* ================= TOAST ================= */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,0.92);
  color: white;
  padding: 14px 22px;
  border-radius: 999px;
  opacity: 0;
  transition: 0.4s;
  z-index: 9999;
  font-size: 14px;
}

#toast.show { opacity: 1; }

</style>
</head>

<body>

<div id="toast">Successfully logged in</div>

<!-- ARCHIVE -->
<div class="top-archive" id="archive">
  <div class="archive-card-top" onclick="goArchive()">
    ARCHIVE
  </div>
</div>

<!-- SETUP -->
<div class="center-wrap" id="setupScreen">

  <div class="card">
    <label>Players</label>

    <select id="players">
      <option value="1">1 Player</option>
      <option value="2">2 Players</option>
      <option value="3">3 Players</option>
      <option value="4">4 Players</option>
      <option value="5">5 Players</option>
    </select>

    <button onclick="showPlayers()">OK</button>
  </div>

</div>

<!-- PLAYERS -->
<section id="playersSection">
  <div id="playerContainer"></div>

  <div id="nextWrap">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>
</section>

<script>

let playerData = [];
let mode = "setup"; // 👈 IMPORTANT STATE

function goArchive() {
  window.location.href = "archive.html";
}

/* ================= ARCHIVE VISIBILITY CONTROL ================= */
function updateArchiveVisibility() {
  const archive = document.getElementById("archive");

  if (mode === "setup") {
    archive.classList.remove("hidden");
  } else {
    archive.classList.add("hidden");
  }
}

/* ================= SHOW PLAYERS ================= */
function showPlayers() {

  mode = "players";
  updateArchiveVisibility();

  const count = +document.getElementById("players").value;
  const container = document.getElementById("playerContainer");

  container.innerHTML = "";

  const images = [
    "image/player1.png",
    "image/player2.png",
    "image/player3.png",
    "image/player4.png",
    "image/player5.png"
  ];

  playerData = [];

  for (let i = 0; i < count; i++) {
    const img = images[i % images.length];
    playerData.push({ image: img });

    const div = document.createElement("div");
    div.className = "player-card";

    div.innerHTML = `
      <div class="player-circle">
        <img src="${img}">
      </div>
      <input type="text" placeholder="Player ${i + 1}">
    `;

    container.appendChild(div);
  }

  document.getElementById("playersSection")
    .scrollIntoView({ behavior: "smooth" });
}

/* ================= BACK TO SETUP WHEN SCROLLING UP ================= */
window.addEventListener("scroll", () => {

  const playersSection = document.getElementById("playersSection");
  const rect = playersSection.getBoundingClientRect();

  if (rect.top > window.innerHeight * 0.8) {
    mode = "setup";
  } else {
    mode = "players";
  }

  updateArchiveVisibility();
});

/* ================= NEXT STACK ================= */
function goToHole() {

  const cards = document.querySelectorAll(".player-card");
  const button = document.getElementById("nextBtn");

  button.classList.add("fade");

  cards.forEach((card, i) => {
    setTimeout(() => {
      card.classList.add("stack");
    }, i * 120);
  });

  setTimeout(() => {
    const inputs = document.querySelectorAll(".player-card input");

    const players = [];

    inputs.forEach((input, i) => {
      const name = input.value.trim();
      players.push({
        name: name !== "" ? name : `Player ${i + 1}`,
        image: playerData[i].image
      });
    });

    localStorage.setItem("playerData", JSON.stringify(players));
    localStorage.setItem("activeRound", "true");

    window.location.href = "hole.html";
  }, 1200);
}

/* TOAST */
window.addEventListener("DOMContentLoaded", () => {
  const t = document.getElementById("toast");
  setTimeout(() => t.classList.add("show"), 300);
  setTimeout(() => t.classList.remove("show"), 2500);
  updateArchiveVisibility();
});

</script>

</body>
</html>
