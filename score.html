<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Setup</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="score.css">
</head>

<body>

<section class="section">

  <div class="card">

    <h1>Successfully Logged In</h1>

    <p>Welcome to SØNNER Experience</p>

    <div class="select-box">

      <label>Players</label>

      <select id="players">
        <option value="1">1 Player</option>
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
        <option value="5">5 Players</option>
      </select>

    </div>

    <button onclick="showPlayers()">OK</button>

  </div>

</section>

<section class="section" id="playersSection">

  <div id="playerContainer"></div>

  <div id="nextSection">
    <button id="nextBtn" onclick="goToHole()">NEXT</button>
  </div>

</section>

<script>
function showPlayers() {

  const count = parseInt(document.getElementById("players").value);

  const container = document.getElementById("playerContainer");
  container.innerHTML = "";

  const images = [
    "image/picking.png",
    "image/eye.png",
    "image/heroimage.png"
  ];

  for (let i = 1; i <= count; i++) {

    const image =
      images[Math.floor(Math.random() * images.length)];

    const player = document.createElement("div");

    player.className = "player-card";

    player.innerHTML = `
      <div class="player-circle">
        <img src="${image}" alt="Player">
      </div>

      <input type="text" placeholder="Player ${i}">
    `;

    container.appendChild(player);
  }

  document.getElementById("playersSection")
    .scrollIntoView({
      behavior: "smooth"
    });
}

function goToHole() {

  const names = [];

  document.querySelectorAll(".player-card input")
    .forEach(input => {

      names.push(
        input.value || input.placeholder
      );

    });

  localStorage.setItem(
    "playerNames",
    JSON.stringify(names)
  );

  window.location.href = "hole.html";
}
</script>

</body>
</html>
