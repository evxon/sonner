<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARCHIVE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  font-family: Inter, sans-serif;
  background: #fff;
  margin: 0;
  padding: 40px 20px;
}

/* top */
.top {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 42px;
  background: rgba(0,0,0,0.85);
  color: white;
  border-radius: 999px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  z-index: 10;
}

/* container */
.container {
  margin-top: 100px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* card */
.card {
  padding: 18px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  position: relative;
  cursor: pointer;
  background: white;
}

.title {
  font-size: 12px;
  opacity: 0.5;
  margin-bottom: 10px;
}

/* row */
.player {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  padding: 4px 0;
}

/* delete */
.delete {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal {
  width: 260px;
  background: white;
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

button {
  border: none;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
}

.primary { background: black; color: white; }
.secondary { background: #eee; }
</style>
</head>

<body>

<div class="top" onclick="goBack()">BACK</div>

<div class="container" id="archiveContainer"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <button class="primary" onclick="editRound()">Continue / Edit</button>
    <button class="secondary" onclick="viewFull()">Full Score</button>
    <button class="secondary" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let archives = JSON.parse(localStorage.getItem("golfArchives")) || [];
let selected = null;

function render() {
  const container = document.getElementById("archiveContainer");
  container.innerHTML = "";

  if (!archives.length) {
    container.innerHTML = "<p style='opacity:0.5'>No saved rounds</p>";
    return;
  }

  archives.slice().reverse().forEach((round, i) => {
    const index = archives.length - 1 - i;

    const card = document.createElement("div");
    card.className = "card";

    const date = new Date(round.date).toLocaleString();

    let html = `<div class="title">ROUND ${i+1} • ${date}</div>`;

    round.players.forEach((p, pi) => {
      let total = 0;
      for (let h = 1; h <= 18; h++) {
        total += round.scores[h]?.[pi] || 0;
      }

      html += `<div class="player">
        <span>${p.name}</span>
        <span>${total}</span>
      </div>`;
    });

    card.innerHTML = html;

    card.onclick = () => {
      selected = index;
      document.getElementById("modal").style.display = "flex";
    };

    const del = document.createElement("div");
    del.className = "delete";
    del.innerText = "×";

    del.onclick = (e) => {
      e.stopPropagation();
      archives.splice(index, 1);
      localStorage.setItem("golfArchives", JSON.stringify(archives));
      render();
    };

    card.appendChild(del);
    container.appendChild(card);
  });
}

function editRound() {
  localStorage.setItem("editMode", "true");
  localStorage.setItem("activeArchiveIndex", selected);
  window.location.href = "hole.html";
}

function viewFull() {
  const r = archives[selected];
  alert(r.players.map((p,i)=>{
    let t=0;
    for(let h=1;h<=18;h++) t+=r.scores[h]?.[i]||0;
    return `${p.name}: ${t}`;
  }).join("\n"));
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function goBack(){
  window.location.href="score.html";
}

render();
</script>

</body>
</html>
