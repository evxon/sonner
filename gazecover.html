<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Gaze Cover | SØNNER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Inter',sans-serif;
    margin:0;
    background:white;
    color:black;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:80px 40px;
}

.logo{
    text-decoration:none;
    color:black;
    font-size:2rem;
}

/* PRODUCT SECTION */
.product{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    margin-top:80px;
}

.product img{
    width:100%;
}

/* TEXT */
.title{
    font-size:3rem;
    margin-bottom:20px;
}

.price{
    font-size:1.3rem;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* COLOR DOTS */
.color-options{
    display:flex;
    gap:10px;
    align-items:center;
    margin-left:10px;
}

.color-btn{
    width:18px;
    height:18px;
    border-radius:50%;
    border:1px solid #aaa;
    cursor:pointer;
    transition:0.2s;
}

.color-btn:hover{
    transform:scale(1.15);
}

.black{
    background:black;
}

.skin{
    background:#d8b49c;
}

/* BUTTON */
.button{
    display:inline-block;
    padding:14px 28px;
    border:1px solid black;
    color:black;
    text-decoration:none;
}

.button:hover{
    background:black;
    color:white;
}

/* GALLERY */
.gallery{
    margin-top:120px;
}

.gallery img{
    width:100%;
    display:block;
    margin-bottom:40px;
}

/* MOBILE */
@media(max-width:900px){

.product{
    grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<a href="index.html" class="logo">Ø</a>

<div class="product">

<!-- IMAGE -->
<img id="productImage" src="image/gaze-driver-cover.jpg" alt="">

<!-- INFO -->
<div>

<h1 class="title">The Gaze Cover</h1>

<div class="price">
    $69

    <div class="color-options">
        <div class="color-btn black" onclick="setImage('black')"></div>
        <div class="color-btn skin" onclick="setImage('skin')"></div>
    </div>
</div>

<p>
Protective golf head cover featuring the signature eye motif.
Designed to bring a different perspective to the game.
</p>

<br><br>

<a href="#" class="button">Coming Soon</a>

</div>

</div>

<div class="gallery">

<img src="image/gaze-cover-1.jpg" alt="">
<img src="image/gaze-cover-2.jpg" alt="">
<img src="image/gaze-cover-3.jpg" alt="">

</div>

</div>

<script>
function setImage(color){
    const img = document.getElementById("productImage");

    if(color === "black"){
        img.src = "image/gaze-driver-cover.jpg";
    }

    if(color === "skin"){
        img.src = "image/gaze-cover-color.jpg";
    }
}
</script>

</body>
</html>
