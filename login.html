<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scoreboard</title>

<link rel="icon" type="image/jpeg" href="image/SØNNER LOGO.JPG">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>

<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-card">

    <div class="auth-image">
      <img src="image/eye.png" alt="Eye">
    </div>

    <div class="auth-form">

      <h1>Welcome</h1>
      <p class="subtitle">Login to save your rounds.</p>

      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">

      <div class="auth-buttons">
        <button onclick="createAccount()">Create Account</button>
        <button onclick="login()">Log In</button>
      </div>

    </div>
  </div>
</div>

<!-- HERO -->
<section id="heroScreen" style="display:none;">
  <div class="hero-content">
    <h1>Scoreboard</h1>
    <p class="subtitle">Track your rounds and save history.</p>

    <button onclick="showSetup()">Start Round</button>
    <button onclick="openArchive()">My Archive</button>
  </div>
</section>

<!-- SETUP -->
<section id="setupScreen" class="container" style="display:none;">
  <h1>Players</h1>

  <input id="player1" placeholder="Player 1">
  <input id="player2" placeholder="Player 2">
  <input id="player3" placeholder="Player 3">
  <input id="player4" placeholder="Player 4">

  <button onclick="startRound()">Begin</button>
</section>

<!-- ROUND -->
<section id="roundScreen" class="container" style="display:none;">
  <div class="round-nav">
    <button onclick="previousHole()">←</button>
    <div id="roundLabel">R1</div>
    <button onclick="nextHole()">→</button>
  </div>

  <div id="playerScores"></div>

  <button onclick="finishRound()">Finish</button>
</section>

<!-- RESULTS -->
<section id="resultsScreen" class="container" style="display:none;">
  <h3>Round Complete</h3>
  <div id="playerResults"></div>
</section>

<!-- ARCHIVE -->
<section id="archiveScreen" class="container" style="display:none;">
  <h3>Your Archive</h3>
  <div id="archiveList"></div>
</section>

<script>
let players = [];
let currentHole = 1;
let scores = {};

/* =========================
   SCREEN CONTROL (IMPORTANT FIX)
========================= */

function hideAll(){
  ["authScreen","heroScreen","setupScreen","roundScreen","resultsScreen","archiveScreen"]
  .forEach(id => document.getElementById(id).style.display="none");
}

function showApp(){
  hideAll();
  document.getElementById("heroScreen").style.display = "block";
}

function showAuth(){
  hideAll();
  document.getElementById("authScreen").style.display = "flex";
}

/* FORCE START ON AUTH SCREEN */
window.addEventListener("load", () => {
  showAuth();
});

/* =========================
   AUTH (YOU CONNECT FIREBASE HERE)
========================= */

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  // CALL FIREBASE LOGIN (from auth.js)
  window.doLogin(email, password);
}

function createAccount(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  window.doCreateAccount(email, password);
}

/* called AFTER successful login */
function loginSuccess(){
  showApp();
}

/* =========================
   NAV
========================= */

function showSetup(){
  hideAll();
  document.getElementById("setupScreen").style.display="block";
}

function openArchive(){
  hideAll();
  document.getElementById("archiveScreen").style.display="block";
}

/* =========================
   ROUND
========================= */

function startRound(){
  players = [];

  for(let i=1;i<=4;i++){
    let name = document.getElementById("player"+i).value;
    if(name) players.push(name);
  }

  players.forEach(p => scores[p] = Array(18).fill(""));

  hideAll();
  document.getElementById("roundScreen").style.display="block";

  renderHole();
}

function renderHole(){
  document.getElementById("roundLabel").innerText = "R"+currentHole;

  let html = "";

  players.forEach(p=>{
    html += `
      <div>
        ${p}
        <input type="number" onchange="scores['${p}'][currentHole-1]=this.value">
      </div>
    `;
  });

  document.getElementById("playerScores").innerHTML = html;
}

function nextHole(){ if(currentHole<18){ currentHole++; renderHole(); } }
function previousHole(){ if(currentHole>1){ currentHole--; renderHole(); } }

/* =========================
   FINISH
========================= */

function finishRound(){

  let result = players.map(p=>{
    let total = 0;
    scores[p].forEach(v=>{
      let n = parseInt(v);
      if(!isNaN(n)) total += n;
    });

    return {name:p, score:total};
  });

  hideAll();
  document.getElementById("resultsScreen").style.display="block";

  document.getElementById("playerResults").innerHTML =
    result.map(r=>`<div>${r.name} — ${r.score}</div>`).join("");
}
</script>

<script type="module" src="auth.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
