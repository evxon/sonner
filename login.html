<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scoreboard Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>

<body>

<!-- ALWAYS SHOWN FIRST -->
<div id="authScreen">
  <div class="auth-card">

    <div class="auth-image">
      <img src="image/eye.png" alt="eye">
    </div>

    <div class="auth-form">

      <h1>Welcome</h1>
      <p class="subtitle">Sign in to continue</p>

      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">

      <div class="auth-buttons">
        <button onclick="login()">Log In</button>
        <button onclick="createAccount()">Create</button>
      </div>

    </div>
  </div>
</div>

<!-- APP (HIDDEN ALWAYS UNTIL MANUAL LOGIN) -->
<section id="heroScreen" style="display:none;">
  <div class="hero-content">
    <h1>Scoreboard</h1>
    <p class="subtitle">Track your rounds and save history.</p>

    <button onclick="showSetup()">Start Round</button>
    <button onclick="openArchive()">My Archive</button>
  </div>
</section>

<section id="setupScreen" style="display:none;" class="container">
  <h1>Players</h1>

  <input id="player1" placeholder="Player 1">
  <input id="player2" placeholder="Player 2">
  <input id="player3" placeholder="Player 3">
  <input id="player4" placeholder="Player 4">

  <button onclick="startRound()">Begin</button>
</section>

<section id="roundScreen" style="display:none;" class="container">
  <div class="round-nav">
    <button onclick="previousHole()">←</button>
    <div id="roundLabel">R1</div>
    <button onclick="nextHole()">→</button>
  </div>

  <div id="playerScores"></div>

  <button onclick="finishRound()">Finish</button>
</section>

<section id="resultsScreen" style="display:none;" class="container">
  <h3>Round Complete</h3>
  <div id="playerResults"></div>
</section>

<section id="archiveScreen" style="display:none;" class="container">
  <h3>Archive</h3>
  <div id="archiveList"></div>
</section>

<script>
let players = [];
let currentHole = 1;
let scores = {};

/* =========================
   HARD RULE: NEVER AUTO LOGIN
========================= */

function showLogin(){
  document.getElementById("authScreen").style.display = "flex";

  ["heroScreen","setupScreen","roundScreen","resultsScreen","archiveScreen"]
  .forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

function showApp(){
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("heroScreen").style.display = "block";
}

/* ALWAYS START HERE */
window.onload = () => {
  showLogin();
};

/* =========================
   AUTH ACTIONS (ONLY USER CLICKED)
========================= */

function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  window.doLogin(email, password);
}

function createAccount(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  window.doCreateAccount(email, password);
}

/* ONLY CALLED AFTER SUCCESSFUL LOGIN CLICK */
function loginSuccess(){
  showApp();
}
</script>

<script type="module" src="auth.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
