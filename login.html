<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>

<body>

<div id="pageTransition"></div>

<div class="container">

  <div class="title">
    <h1>SØNNER</h1>
    <p>Sign in to continue</p>
  </div>

  <div class="form">

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button class="btn primary" onclick="login()">Log In</button>

    <div class="divider">or</div>

    <button class="btn google" onclick="googleLogin()">
      Continue with Google
    </button>

    <button class="btn secondary" onclick="createAccount()">
      Create Account
    </button>

  </div>

</div>

<script type="module" src="firebase.js?v=2"></script>
<script type="module" src="auth.js?v=2"></script>

</body>
</html>
